[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dex-supermimic"
version = "0.1.0"
description = "Dex whole-body motion tracking with a learned world model and BPTT"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {file = "LICENSE"}
dependencies = ["numpy==1.26.4", "mujoco==3.16.0", "onnxruntime==1.31.0"]

[project.optional-dependencies]
convert = ["scipy>=1.11,<2"]
train = ["torch==2.10.0", "mujoco-warp==3.16.0", "warp-lang==1.18.0", "onnx==1.21.0", "tensorboard", "psutil"]
video = ["pillow", "imageio", "imageio-ffmpeg"]
test = ["pytest>=8"]

[project.scripts]
dex-sm = "dex_supermimic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dex_supermimic.data" = ["quality_v7.json"]
"dex_supermimic.data.v7" = ["*.json", "reference/*.json", "reference/*.bvh", "reference/GMR_LICENSE", "reference/NVIDIA/LICENSE", "reference/NVIDIA/soma_retargeter/assets/soma/contact_processing/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
